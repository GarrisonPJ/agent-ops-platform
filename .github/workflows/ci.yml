name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops
          POSTGRES_DB: agentops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentops -d agentops_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://agentops:agentops@localhost:5432/agentops_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Verify generated protocol schemas
        run: |
          PYTHONPATH=. uv run python scripts/export_protocol_schema.py
          git diff --exit-code -- ../contracts/v1/*.schema.json
      - name: Test control plane
        run: uv run pytest phase1_tests/ -q --tb=short
      - name: Verify migration round trip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  retention-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      retention-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retention_ci
          POSTGRES_PASSWORD: retention_ci_password
          POSTGRES_DB: retention_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U retention_ci -d retention_ci'
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://retention_ci:retention_ci_password@localhost:5432/retention_ci
      RETENTION_POSTGRES_URL: postgresql+asyncpg://retention_ci:retention_ci_password@localhost:5432/retention_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.14'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Migrate retention database to Alembic Head
        run: uv run alembic upgrade head
      - name: Verify live Alembic Head
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          import re

          from app.migrations import application_alembic_head
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          revision_pattern = re.compile(r'[A-Za-z0-9][A-Za-z0-9_-]{0,63}')

          async def verify_head() -> None:
              engine = create_async_engine(os.environ['DATABASE_URL'])
              try:
                  async with engine.connect() as connection:
                      live = (
                          await connection.execute(
                              text('SELECT version_num FROM alembic_version')
                          )
                      ).scalar_one()
                  expected = application_alembic_head()
                  if (
                      not isinstance(expected, str)
                      or revision_pattern.fullmatch(expected) is None
                      or not isinstance(live, str)
                      or revision_pattern.fullmatch(live) is None
                  ):
                      raise SystemExit('Invalid Alembic revision')
                  if live != expected:
                      raise SystemExit('Alembic revision mismatch')
                  print('Alembic revision verified')
              finally:
                  await engine.dispose()

          asyncio.run(verify_head())
          PY
      - name: Test PostgreSQL retention
        run: uv run pytest phase1_tests/test_data_retention_postgres.py -q --tb=short

  database-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      recovery-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops
          POSTGRES_DB: agentops_recovery_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentops -d agentops_recovery_source"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://agentops:agentops@localhost:5432/agentops_recovery_source
      RESTORE_DATABASE_NAME: agentops_restore_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-16
          pg_dump --version
          pg_restore --version
      - name: Migrate recovery source to Alembic Head
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Run backup and restore rehearsal
        run: PYTHONPATH=backend uv run --project backend python scripts/backup_restore_e2e.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test live and recorded adapters
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test recorded product loop
        run: npm run e2e:recorded

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test protocol and process supervision
        run: cargo test --workspace --locked

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate focused Compose stack
        run: docker compose -f infra/docker/docker-compose.phase1.yml config --quiet

  golden-e2e:
    needs: [backend, database-recovery, frontend, rust, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start real stack
        run: docker compose -f infra/docker/docker-compose.phase1.yml up -d --build
      - name: Run Golden closed loop
        run: python3 scripts/golden_e2e.py
      - name: Run Runner recovery fault test
        run: python3 scripts/recovery_e2e.py
      - name: Show service state
        if: always()
        run: docker compose -f infra/docker/docker-compose.phase1.yml ps
      - name: Show failure logs
        if: failure()
        run: docker compose -f infra/docker/docker-compose.phase1.yml logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.phase1.yml down --volumes
